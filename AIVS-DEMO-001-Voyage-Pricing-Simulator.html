<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage Pricing Simulator — AIVS-DEMO-001</title>
<style>
  /* ---- Palette (matches the deck) ---- */
  :root{
    --ink:#0E2438; --ink2:#17334D; --teal:#1C7293; --amber:#C9702A;
    --green:#2E7D68; --mist:#EEF3F6; --fade:#B9C7D2; --white:#FFFFFF;
    --line:rgba(185,199,210,0.18);
    --gain:#7FD8BF; --loss:#F0A265; --modelblue:#8FD0E6;
    --serif: Cambria, Georgia, "Times New Roman", serif;
    --sans: Calibri, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--mist);
    font-family:var(--sans); font-size:19px; line-height:1.35;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:var(--serif)}

  /* ---- Header ---- */
  #header{
    height:66px; display:flex; align-items:center; gap:22px;
    padding:0 28px; background:var(--ink2); border-bottom:1px solid var(--line);
  }
  #mode-pill{
    font-family:var(--serif); font-weight:700; letter-spacing:.5px;
    padding:8px 18px; border-radius:5px; font-size:20px; white-space:nowrap;
    border:1px solid var(--line);
  }
  #mode-pill.sea{ background:rgba(201,112,42,.18); color:#F0B486; border-color:rgba(201,112,42,.55)}
  #mode-pill.model{ background:rgba(28,114,147,.24); color:var(--modelblue); border-color:rgba(28,114,147,.7)}
  #voyage-counter{font-family:var(--serif); font-size:22px; color:var(--white)}
  #voyage-counter b{font-size:26px}
  #header .spacer{flex:1}
  /* Assumptions button — solid, high-contrast, so the honesty defence is one glance away */
  #btn-assump{
    font-family:var(--sans); font-size:16px; cursor:pointer; color:var(--white);
    background:var(--teal); border:1px solid var(--teal); border-radius:6px;
    padding:9px 18px; transition:filter .15s;
  }
  #btn-assump:hover{filter:brightness(1.1)}
  .btn{
    font-family:var(--sans); font-size:15px; cursor:pointer; color:var(--mist);
    background:transparent; border:1px solid var(--line); border-radius:5px;
    padding:8px 14px; transition:background .15s,border-color .15s;
  }
  .btn:hover{background:rgba(255,255,255,.06); border-color:var(--fade)}

  /* ---- Main grid ---- */
  #main{
    height:calc(100% - 66px); display:grid;
    grid-template-columns: 1fr 1fr; gap:22px; padding:22px 28px;
  }
  .col{display:flex; flex-direction:column; min-height:0}
  .card{
    background:var(--ink2); border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; margin-bottom:18px;
  }
  .card:last-child{margin-bottom:0}
  .card h2{font-size:15px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--fade); font-family:var(--sans); font-weight:600; margin-bottom:14px}

  /* Offer card */
  .route-name{font-family:var(--serif); font-size:34px; color:var(--white); line-height:1.1}
  .offer-sub{margin-top:10px; font-size:19px; color:var(--fade)}
  .offer-sub .dist{color:var(--mist)}
  .preplay{
    display:inline-block; margin-top:12px; font-size:15px; color:#F0B486;
    background:rgba(201,112,42,.12); border:1px solid rgba(201,112,42,.35);
    border-radius:6px; padding:4px 12px;
  }

  /* Expected / actual earnings hero */
  .earn-label{font-size:18px; color:var(--fade); margin-bottom:6px}
  .earn{font-family:var(--serif); font-size:58px; line-height:1; white-space:nowrap}
  .earn .unit{font-size:24px; color:var(--fade); font-family:var(--sans); margin-left:8px}
  .earn.pos{color:var(--gain)} .earn.neg{color:var(--loss)} .earn.neutral{color:var(--modelblue)}
  .tce-note{margin-top:8px; font-size:14px; color:var(--fade); letter-spacing:.3px}
  .band-note{margin-top:10px; font-size:16px; color:var(--fade)}

  /* Single primary action */
  .take-wrap{margin-top:22px}
  .take{
    width:100%; font-family:var(--serif); font-size:26px; font-weight:700; cursor:pointer;
    color:var(--white); background:var(--teal); border:none; border-radius:10px;
    padding:18px 0; transition:filter .12s, transform .12s;
  }
  .take:hover{filter:brightness(1.08); transform:translateY(-1px)}
  .take-hint{margin-top:12px; text-align:center; font-size:16px; color:var(--fade)}
  .take-hint kbd{background:#0b1c2c; border:1px solid var(--line); border-radius:4px; padding:1px 8px}

  /* Resolve banners — WON and LOST carry equal visual weight */
  .banner{
    display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:10px;
    font-family:var(--serif); font-size:26px; font-weight:700; margin-bottom:18px;
  }
  .banner.won{ background:rgba(46,125,104,.22); color:var(--gain); border:1px solid rgba(46,125,104,.6)}
  .banner.lost{ background:rgba(201,112,42,.20); color:var(--loss); border:1px solid rgba(201,112,42,.6)}
  .banner .mark{font-size:30px}
  .bid-line{font-size:18px; color:var(--fade); margin-bottom:18px}
  .bid-line b{color:var(--mist); font-family:var(--serif); font-size:20px}
  .context{margin-top:16px; font-size:17px; color:var(--fade); line-height:1.5}
  .compare-earn{display:flex; align-items:flex-end; gap:32px; flex-wrap:wrap}
  .compare-earn .then{opacity:.75}
  .compare-earn .then .earn{font-size:34px}
  .compare-earn .then .earn-label{font-size:15px}

  .advance{margin-top:22px; font-size:17px; color:var(--fade)}
  .advance kbd{background:#0b1c2c; border:1px solid var(--line); border-radius:4px; padding:2px 9px}

  /* Right column: chart + scoreboard */
  #chart-card{flex:1; display:flex; flex-direction:column; min-height:0}
  #chart-card .legend{display:flex; gap:22px; margin-bottom:8px; font-size:15px; color:var(--fade)}
  #chart-card .legend i{display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:7px; vertical-align:-2px}
  #chart-wrap{flex:1; min-height:0}
  svg{width:100%; height:100%; display:block}

  .score-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
  .score .k{font-size:16px; color:var(--fade); letter-spacing:.3px; margin-bottom:6px}
  .score .v{font-size:48px; font-family:var(--serif); line-height:1; white-space:nowrap}
  .score .v.money{color:var(--gain)} .score .v.money.neg{color:var(--loss)}

  /* Summary overlay */
  #summary{
    position:fixed; inset:0; background:rgba(9,22,35,.98); z-index:40;
    display:none; align-items:center; justify-content:center; padding:44px;
  }
  #summary.show{display:flex}
  .sum-box{max-width:1080px; width:100%; text-align:center}

  /* single-mode (today's curve) summary */
  .sum-lead{font-size:22px; color:var(--fade); margin-bottom:10px}
  .sum-hero{font-family:var(--serif); font-size:112px; line-height:1; color:var(--gain)}
  .sum-hero.neg{color:var(--loss)}
  .sum-sub{font-size:26px; color:var(--mist); margin-top:8px}
  .sum-cta{
    margin-top:40px; display:inline-block; font-family:var(--serif); font-size:30px; font-weight:700;
    color:var(--white); background:var(--teal); border-radius:12px; padding:20px 36px;
  }
  .sum-cta .k{font-family:var(--sans); font-size:16px; background:#0b1c2c; border:1px solid rgba(255,255,255,.25);
    border-radius:5px; padding:3px 11px; margin-right:12px; vertical-align:middle}
  .sum-foot{margin-top:26px; color:var(--fade); font-size:16px}
  .sum-foot kbd{background:#0b1c2c; border:1px solid var(--line); border-radius:4px; padding:2px 9px; margin:0 2px}

  /* comparison summary — the money delta is the single largest object */
  .delta-lead{font-size:24px; color:var(--fade); margin-bottom:6px}
  .delta{font-family:var(--serif); font-size:128px; line-height:1; color:var(--gain)}
  .delta-sub{font-size:30px; color:var(--mist); margin-top:6px}
  .cols{display:flex; justify-content:center; gap:26px; margin:34px 0 24px}
  .mode-col{border:1px solid var(--line); border-radius:12px; padding:18px 30px; min-width:300px; background:var(--ink2)}
  .mode-col.sea{border-color:rgba(201,112,42,.4)}
  .mode-col.model{border-color:rgba(28,114,147,.55)}
  .mode-col .title{font-family:var(--serif); font-size:20px; margin-bottom:10px; font-weight:700}
  .mode-col.sea .title{color:#F0B486} .mode-col.model .title{color:var(--modelblue)}
  .mode-col .row{font-size:20px; color:var(--fade); margin-top:6px}
  .mode-col .row b{font-family:var(--serif); font-size:24px; color:var(--white)}
  .verdict-line{font-size:20px; color:var(--fade); max-width:800px; margin:0 auto; line-height:1.5}

  /* Assumptions panel */
  #assump{
    position:fixed; top:0; right:0; height:100%; width:440px; max-width:92vw; z-index:50;
    background:var(--ink2); border-left:1px solid var(--line); transform:translateX(100%);
    transition:transform .25s ease; display:flex; flex-direction:column;
    box-shadow:-16px 0 40px rgba(0,0,0,.4);
  }
  #assump.show{transform:translateX(0)}
  #assump .ah{display:flex; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line)}
  #assump .ah h2{font-family:var(--serif); font-size:22px; color:var(--white); flex:1}
  #assump .body{padding:16px 22px; overflow-y:auto}
  #assump .note{
    font-size:15px; color:#F0B486; background:rgba(201,112,42,.12);
    border:1px solid rgba(201,112,42,.4); border-radius:8px; padding:10px 12px; margin-bottom:18px;
  }
  .arow{display:flex; align-items:center; margin-bottom:10px; gap:10px}
  .arow label{flex:1; font-size:15px; color:var(--mist)}
  .arow label small{display:block; color:var(--fade); font-size:12.5px; line-height:1.3}
  .arow input{
    width:110px; font-family:var(--sans); font-size:16px; text-align:right;
    background:var(--ink); color:var(--mist); border:1px solid var(--line);
    border-radius:6px; padding:7px 9px;
  }
  .arow input:focus{outline:none; border-color:var(--teal)}
  #assump .foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:12px}
  #assump .foot .btn{flex:1; text-align:center; font-size:16px; padding:11px 0}
  .btn.primary{background:var(--teal); color:var(--white); border-color:var(--teal)}
  .section-h{font-size:13px; letter-spacing:1.4px; text-transform:uppercase; color:var(--fade);
    margin:16px 0 8px; font-weight:600}

  @media (max-width:1400px){
    body{font-size:18px}
    .route-name{font-size:30px}
    .earn{font-size:50px}
    .score .v{font-size:42px}
    .sum-hero{font-size:96px}
    .delta{font-size:104px}
  }
</style>
</head>
<body>

<div id="header">
  <div id="mode-pill" class="sea">TODAY'S CURVE</div>
  <div id="voyage-counter">Cargo <b>1</b> of 10</div>
  <div class="spacer"></div>
  <button id="btn-assump">Where do these numbers come from?</button>
</div>

<div id="main">
  <div class="col" id="left"></div>
  <div class="col" id="right">
    <div class="card" id="chart-card">
      <h2>The running book — what we expected vs what we earned</h2>
      <div class="legend">
        <span><i style="background:#1C7293;opacity:.7"></i>What we expected</span>
        <span><i style="background:#2E7D68"></i>What we earned</span>
        <span><i style="background:#C9702A"></i>Earned less than nothing (a loss)</span>
      </div>
      <div id="chart-wrap"></div>
    </div>
    <div class="card">
      <h2>Scoreboard</h2>
      <div class="score-grid" id="scoreboard"></div>
    </div>
  </div>
</div>

<div id="summary"><div class="sum-box" id="sum-box"></div></div>

<div id="assump">
  <div class="ah"><h2>Assumptions</h2><button class="btn" id="btn-assump-close">Close</button></div>
  <div class="body" id="assump-body"></div>
  <div class="foot">
    <button class="btn" id="btn-assump-reset">Restore defaults</button>
    <button class="btn primary" id="btn-assump-apply">Apply &amp; replay</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   AIVS-DEMO-001 — The Voyage Pricing Simulator
   Single file. No network. No storage. Deterministic (seeded mulberry32).

   NOTE FOR AIVS-DEMO-002 (the subtraction pass): the simulation model below
   — parameters, PRNG, cost curves, generate/outcome/canonical — is left
   BYTE-FOR-BYTE unchanged from the audited build. Section 4 of AIVS-DEMO-001
   is settled and the rehearsals depend on it. Only presentation and flow
   were changed in the audit session.
   ========================================================================= */

/* ---- All tunable parameters live here (shown in the Assumptions panel) --- */
var DEFAULTS = {
  v_trial:      13.0,   // sea-trial speed (kn)
  c_trial:      22.0,   // sea-trial ME consumption at v_trial (mt/day)
  k_foul:       0.004,  // consumption penalty per month since drydock
  s_foul:       0.0015, // speed loss fraction per month since drydock
  m_weather:    0.09,   // consumption penalty per unit of weather index
  s_weather:    0.035,  // speed loss fraction per unit of weather index
  margin_desk:  0.05,   // FLAT weather margin the desk adds today (the core mechanic)
  W_expected:   1.2,    // weather index the model plans for
  bunker_price: 650,    // $/mt
  target_margin:0.25,   // desk markup over break-even to form a quote
  comp_spread:  0.12,   // width of competitor's quote noise
  seed:         20260835
};
var ASSUMPTIONS = clone(DEFAULTS);

/* Route pool. Distances/port figures are illustrative, not company data. */
var ROUTES = [
  { name:"Santos → Qingdao",      nm:11800, port_days:5.0, port_costs:185000, coastal:false },
  { name:"US Gulf → Rotterdam",   nm:4900,  port_days:4.0, port_costs:140000, coastal:false },
  { name:"Richards Bay → Mundra", nm:4100,  port_days:3.5, port_costs:120000, coastal:false },
  { name:"Vancouver → Japan",     nm:4300,  port_days:4.0, port_costs:130000, coastal:false },
  { name:"Newcastle → Zhoushan",  nm:4400,  port_days:3.5, port_costs:125000, coastal:false },
  { name:"Tubarão → Rotterdam",   nm:4600,  port_days:4.0, port_costs:135000, coastal:false },
  { name:"Paradip → Kandla",      nm:1900,  port_days:3.0, port_costs:95000,  coastal:true  },
  { name:"New Orleans → Kobe",    nm:9200,  port_days:5.0, port_costs:175000, coastal:false }
];

/* Metadata for the assumptions panel (label + short note + step) */
var PARAM_META = [
  { key:"v_trial",      label:"Sea-trial speed", note:"knots", step:0.1 },
  { key:"c_trial",      label:"Trial consumption", note:"mt/day at trial speed", step:0.5 },
  { key:"k_foul",       label:"Fouling — fuel", note:"extra consumption / month since drydock", step:0.001 },
  { key:"s_foul",       label:"Fouling — speed", note:"speed loss / month since drydock", step:0.0005 },
  { key:"m_weather",    label:"Weather — fuel", note:"extra consumption / weather unit", step:0.01 },
  { key:"s_weather",    label:"Weather — speed", note:"speed loss / weather unit", step:0.005 },
  { key:"margin_desk",  label:"Desk flat margin", note:"the constant cushion today's curve adds", step:0.01 },
  { key:"W_expected",   label:"Model planned weather", note:"weather index the model assumes", step:0.1 },
  { key:"bunker_price", label:"Bunker price", note:"$/mt", step:10 },
  { key:"target_margin",label:"Quote markup", note:"markup over break-even to form a quote", step:0.01 },
  { key:"comp_spread",  label:"Competitor spread", note:"width of rival-quote noise", step:0.01 },
  { key:"seed",         label:"Random seed", note:"change live to prove it is not cherry-picked", step:1 }
];

/* ---- Deterministic PRNG: mulberry32 -------------------------------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- Cost curves --------------------------------------------------------- */
function costActual(D, port, h, W){
  var A = ASSUMPTIONS;
  var v = A.v_trial * (1 - A.s_foul*h - A.s_weather*W);
  var c = A.c_trial * (1 + A.k_foul*h) * (1 + A.m_weather*W);
  var days = D / (24 * v);
  var fuel = days * c;
  return { days:days, fuel:fuel, cost:fuel*A.bunker_price + port };
}
function costSeaTrial(D, port){
  // FLAT desk margin — over-corrects a fresh hull, under-corrects an old one.
  var A = ASSUMPTIONS;
  var days = (D / (24 * A.v_trial)) * (1 + A.margin_desk);
  var fuel = days * A.c_trial * (1 + A.margin_desk);
  return { days:days, fuel:fuel, cost:fuel*A.bunker_price + port };
}
function costModel(D, port, h){
  // Corrected for this hull's age; blind to this voyage's actual weather.
  var A = ASSUMPTIONS;
  var v = A.v_trial * (1 - A.s_foul*h - A.s_weather*A.W_expected);
  var c = A.c_trial * (1 + A.k_foul*h) * (1 + A.m_weather*A.W_expected);
  var days = D / (24 * v);
  var fuel = days * c;
  return { days:days, fuel:fuel, cost:fuel*A.bunker_price + port };
}

/* ---- State --------------------------------------------------------------- */
var state = {
  mode: "seaTrial",      // "seaTrial" | "model"
  idx: 0,                // 0..9 current voyage; 10 = summary
  stage: "decide",       // "decide" | "resolved"
  voyages: [],
  decisions: [],         // per voyage: "quote" | null
  chartMin: 0, chartMax: 1,
  canonical: null,       // {seaTrial:{won,profit,avgGap}, model:{...}}
  modelRevealed: false   // the model column stays hidden until M is pressed (the peak)
};

/* Build the ten voyages from the seed; draw order is fixed and identical
   across both modes, so the comparison is like-for-like. */
function generate(){
  var A = ASSUMPTIONS;
  var rand = mulberry32(A.seed | 0);
  var vs = [];
  for (var i=0; i<10; i++){
    var r     = ROUTES[Math.floor(rand()*ROUTES.length)];
    var cargo = 30000 + Math.round(rand()*8000);
    var h     = Math.round(8 + rand()*46);   // months since last drydock, 8..54
    var W     = 0.5 + rand()*1.5;            // weather index, mean ~1.2
    var noise = -A.comp_spread + rand()*2*A.comp_spread;

    var act = costActual(r.nm, r.port_costs, h, W);
    var st  = costSeaTrial(r.nm, r.port_costs);
    var md  = costModel(r.nm, r.port_costs, h);

    var fairRate   = (act.cost / cargo) * (1 + A.target_margin);
    var competitor = fairRate * (1 + noise);
    var marketInd  = fairRate;                // shown rounded, as "recent market"

    var v = {
      route:r, cargo:cargo, h:h, W:W,
      competitor:competitor, marketInd:marketInd,
      actual:act,
      seaTrial: outcome(st, act, r, cargo, competitor, A.target_margin, null),
      model:    outcome(md, act, r, cargo, competitor, A.target_margin,
                        modelBand(md, r, cargo, A.target_margin, h))
    };
    vs.push(v);
  }
  state.voyages = vs;

  // Fixed chart scale from all estimate/realised values, both modes, incl. 0.
  var lo = 0, hi = 0;
  for (var j=0;j<vs.length;j++){
    ["seaTrial","model"].forEach(function(m){
      var o = vs[j][m];
      lo = Math.min(lo, o.estTCE, o.realTCE);
      hi = Math.max(hi, o.estTCE, o.realTCE);
    });
  }
  var pad = (hi - lo) * 0.12;
  state.chartMin = lo - pad;
  state.chartMax = hi + pad;

  // Canonical quote-all outcome for each mode (drives the summary headline).
  state.canonical = { seaTrial: summarizeCanonical("seaTrial"), model: summarizeCanonical("model") };
}

function outcome(est, act, r, cargo, competitor, targetMargin, band){
  var quote   = (est.cost / cargo) * (1 + targetMargin);
  var revenue = quote * cargo;
  var estTCE  = (revenue - est.cost) / (est.days + r.port_days);
  var realTCE = (revenue - act.cost) / (act.days + r.port_days);
  return {
    quote:quote, win:(quote <= competitor),
    estDays:est.days, estFuel:est.fuel,
    estTCE:estTCE, realTCE:realTCE,
    realProfit:(revenue - act.cost),
    gapTCE:(estTCE - realTCE), band:band
  };
}
function modelBand(est, r, cargo, targetMargin, h){
  // Confidence widens with hull age and on coastal routes.
  var pct = 0.03 + 0.0012*h + (r.coastal ? 0.05 : 0);
  var quote = (est.cost / cargo) * (1 + targetMargin);
  var estTCE = (quote*cargo - est.cost) / (est.days + r.port_days);
  return estTCE * pct;
}
function summarizeCanonical(mode){
  var won=0, profit=0, gap=0, n=0;
  for (var i=0;i<state.voyages.length;i++){
    var o = state.voyages[i][mode];
    if (o.win){ won++; profit += o.realProfit; gap += o.gapTCE; n++; }
  }
  return { won:won, profit:profit, avgGap:(n?gap/n:0) };
}

/* ---- Live scoreboard (reflects the player's actual decisions) ------------ */
function liveScore(){
  var won=0, profit=0;
  for (var i=0;i<state.voyages.length;i++){
    if (state.decisions[i] !== "quote") continue;
    var o = state.voyages[i][state.mode];
    if (o.win){ won++; profit += o.realProfit; }
  }
  return { won:won, profit:profit };
}

/* ---- Formatting helpers -------------------------------------------------- */
function clone(o){ var n={}; for (var k in o) if (o.hasOwnProperty(k)) n[k]=o[k]; return n; }
function money(x){
  var s = Math.abs(Math.round(x)).toLocaleString("en-US");
  return (x<0?"−$":"$") + s;
}
function signed(x){                     // "+$4,368" / "−$837" — for the earnings hero
  var s = Math.abs(Math.round(x)).toLocaleString("en-US");
  return (x<0?"−$":"+$") + s;
}
function n0(x){ return Math.round(x).toLocaleString("en-US"); }
function rate(x){ return "$" + x.toFixed(2); }
/* Plain-language hull cue — no raw month figure (F5). */
function hullCue(h){
  if (h >= 42) return "hull years overdue for cleaning";
  if (h >= 30) return "hull overdue for cleaning";
  if (h >= 20) return "hull due for cleaning";
  if (h >= 10) return "hull cleaned fairly recently";
  return "hull freshly cleaned";
}
function weatherWord(W){
  if (W >= 1.6) return "heavy weather";
  if (W >= 1.0) return "moderate weather";
  return "calm weather";
}

/* ===================== RENDER ============================================= */
function render(){
  try { renderInner(); }
  catch (err){ renderFailsafe(err); }
}

function renderInner(){
  var pill = document.getElementById("mode-pill");
  if (state.mode === "seaTrial"){ pill.className="sea"; pill.textContent="TODAY'S CURVE"; }
  else { pill.className="model"; pill.textContent="THE MODEL"; }
  var vc = state.idx>=10 ? 10 : state.idx+1;
  document.getElementById("voyage-counter").innerHTML = "Cargo <b>"+vc+"</b> of 10";

  renderLeft();
  renderChart();
  renderScoreboard();

  var sum = document.getElementById("summary");
  if (state.idx >= 10){ renderSummary(); sum.classList.add("show"); }
  else sum.classList.remove("show");
}

function renderLeft(){
  var left = document.getElementById("left");
  if (state.idx >= 10){ left.innerHTML = ""; return; }

  var v = state.voyages[state.idx];
  var o = v[state.mode];
  var isPreplay = (state.idx === 0);   // voyage 1 is played for the user
  var html = "";

  // Cargo on offer — route, one plain sub-line, hull state in words
  html += '<div class="card">'
        +   '<h2>The cargo on offer</h2>'
        +   '<div class="route-name">'+v.route.name+'</div>'
        +   '<div class="offer-sub"><span class="dist">'+n0(v.route.nm)+' nm</span> · '+hullCue(v.h)+'</div>';
  if (isPreplay && state.stage==="resolved"){
    html += '<div class="preplay">First cargo — played for you. Press Space to take the wheel.</div>';
  }
  html += '</div>';

  if (state.stage === "decide"){
    // Expected earnings + the single action
    var modeWord = state.mode==="seaTrial" ? "today's curve" : "the model";
    html += '<div class="card">'
          +   '<h2>If you take it, you expect to earn</h2>'
          +   '<div class="earn pos">'+signed(o.estTCE)+'<span class="unit">a day</span></div>'
          +   '<div class="tce-note">expected profit per day · "TCE" to the desk · from '+modeWord+'</div>';
    if (state.mode==="model" && o.band){
      html += '<div class="band-note">the model is confident to within ±'+money(o.band)+' a day</div>';
    }
    html +=   '<div class="take-wrap">'
          +     '<button class="take" id="act-take">TAKE THIS CARGO</button>'
          +     '<div class="take-hint">or press <kbd>Space</kbd></div>'
          +   '</div>'
          + '</div>';
  } else {
    html += renderReveal(v, o);
  }

  left.innerHTML = html;
  if (state.stage === "decide"){
    document.getElementById("act-take").addEventListener("click", doTake);
  }
}

function renderReveal(v, o){
  var html = '<div class="card">';
  if (o.win){
    html += '<div class="banner won"><span class="mark">✓</span> You won this cargo</div>'
          + '<div class="bid-line">You bid <b>'+rate(o.quote)+'/t</b> · the rival bid <b>'+rate(v.competitor)+'/t</b> — lower bid wins.</div>'
          + '<div class="compare-earn">'
          +   '<div><div class="earn-label">You expected</div>'
          +     '<div class="earn neutral" style="font-size:38px">'+signed(o.estTCE)+'<span class="unit" style="font-size:18px">a day</span></div></div>'
          +   '<div><div class="earn-label">You actually earned</div>'
          +     '<div class="earn '+(o.realTCE>=0?'pos':'neg')+'">'+signed(o.realTCE)+'<span class="unit">a day</span></div></div>'
          + '</div>'
          + '<div class="context">Same cargo, real voyage: '+hullCue(v.h)+', '+weatherWord(v.W)+'. '
          +   'The flat desk cushion never saw either — so what you earned came in under what you expected.</div>';
  } else {
    html += '<div class="banner lost"><span class="mark">✕</span> A rival bid lower — cargo lost</div>'
          + '<div class="bid-line">You bid <b>'+rate(o.quote)+'/t</b> · the rival bid <b>'+rate(v.competitor)+'/t</b>. '
          +   'They win it, you walk away — no voyage, no exposure.</div>';
  }
  var last = state.idx >= 9;
  html += '<div class="advance">Press <kbd>Space</kbd> '
        + (last ? 'to see how the book finished.' : 'for the next cargo.') + '</div>';
  return html + '</div>';
}

/* ---- Chart (hand-rolled inline SVG) — bars only, one break-even line ------ */
function renderChart(){
  var W = 720, H = 380, padL = 60, padR = 18, padT = 18, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var lo = state.chartMin, hi = state.chartMax;
  function y(val){ return padT + (hi - val)/(hi - lo) * plotH; }
  var zeroY = y(0);
  var slotW = plotW / 10;

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '
          + 'aria-label="What we expected versus what we earned, per cargo">';

  // Single reference: the break-even line (labelled in words, no numbers)
  svg += '<line x1="'+padL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+zeroY.toFixed(1)
       + '" stroke="#B9C7D2" stroke-opacity="0.5" stroke-width="1.4"/>';
  svg += '<text x="'+padL+'" y="'+(zeroY-8).toFixed(1)+'" fill="#B9C7D2" font-size="14" '
       + 'font-family="Calibri, Segoe UI, sans-serif">break-even</text>';

  var reachedTo = state.stage==="resolved" ? state.idx : state.idx-1;
  for (var i=0;i<10;i++){
    var cx = padL + slotW*i + slotW/2;
    if (i > reachedTo) continue;
    if (state.decisions[i] !== "quote") continue;

    var o = state.voyages[i][state.mode];
    var bw = Math.min(22, slotW*0.32);
    var gap = 6;
    var exL = cx - bw - gap/2;
    var reL = cx + gap/2;

    // Expected bar
    svg += bar(exL, bw, y(o.estTCE), zeroY, "#1C7293", 0.65);
    if (state.mode==="model" && o.band){
      var yTop = y(o.estTCE + o.band), yBot = y(o.estTCE - o.band), mid = exL + bw/2;
      svg += '<line x1="'+mid.toFixed(1)+'" y1="'+yTop.toFixed(1)+'" x2="'+mid.toFixed(1)+'" y2="'+yBot.toFixed(1)
           + '" stroke="#8FD0E6" stroke-width="1.4" stroke-opacity="0.9"/>'
           + '<line x1="'+(mid-4).toFixed(1)+'" y1="'+yTop.toFixed(1)+'" x2="'+(mid+4).toFixed(1)+'" y2="'+yTop.toFixed(1)+'" stroke="#8FD0E6" stroke-width="1.4"/>'
           + '<line x1="'+(mid-4).toFixed(1)+'" y1="'+yBot.toFixed(1)+'" x2="'+(mid+4).toFixed(1)+'" y2="'+yBot.toFixed(1)+'" stroke="#8FD0E6" stroke-width="1.4"/>';
    }
    // Earned bar (only when we won)
    if (o.win){
      svg += bar(reL, bw, y(o.realTCE), zeroY, o.realTCE>=0 ? "#2E7D68" : "#C9702A", 1);
    }
  }
  svg += '</svg>';
  document.getElementById("chart-wrap").innerHTML = svg;
}
function bar(x, w, yVal, zeroY, color, op){
  var top = Math.min(yVal, zeroY), h = Math.abs(yVal - zeroY);
  if (h < 1) h = 1;
  return '<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
       + '" rx="2" fill="'+color+'" fill-opacity="'+op+'"/>';
}

/* ---- Scoreboard — two numbers, plain words ------------------------------- */
function renderScoreboard(){
  var s = liveScore();
  var neg = s.profit < 0 ? " neg" : "";
  var html = ''
    + '<div class="score"><div class="k">Cargoes won</div><div class="v">'+s.won+'</div></div>'
    + '<div class="score"><div class="k">Money made so far</div><div class="v money'+neg+'">'+money(s.profit)+'</div></div>';
  document.getElementById("scoreboard").innerHTML = html;
}

/* ---- Summary — single-mode first, comparison revealed by M (the peak) ----- */
function renderSummary(){
  var box = document.getElementById("sum-box");
  if (!state.modelRevealed){
    // Today's-curve result only. The model is withheld until the toggle.
    var s = state.canonical.seaTrial;
    box.innerHTML = ''
      + '<div class="sum-lead">Priced the way the desk does today, you won '+s.won+' of 10 cargoes and made</div>'
      + '<div class="sum-hero'+(s.profit<0?' neg':'')+'">'+money(s.profit)+'</div>'
      + '<div class="sum-sub">Every voyage earned less than you expected. You felt the leak.</div>'
      + '<div class="sum-cta"><span class="k">M</span>Run the same ten cargoes with the model</div>'
      + '<div class="sum-foot">same routes · same weather · same rivals — only the pricing changes'
      +   ' &nbsp;·&nbsp; <kbd>R</kbd> start over</div>';
    return;
  }
  // The reveal: the money delta is the single largest object on the screen.
  var sea = state.canonical.seaTrial, mod = state.canonical.model;
  var wonDiff = sea.won - mod.won;
  var more = mod.profit - sea.profit;
  box.innerHTML = ''
    + '<div class="delta-lead">Same ten cargoes. Same weather. With the model you made</div>'
    + '<div class="delta">'+money(more)+'</div>'
    + '<div class="delta-sub">more money — on '+wonDiff+' fewer cargoes.</div>'
    + '<div class="cols">'
    +   '<div class="mode-col sea"><div class="title">Today\'s curve</div>'
    +     '<div class="row"><b>'+sea.won+'</b> cargoes won</div>'
    +     '<div class="row"><b>'+money(sea.profit)+'</b> made</div></div>'
    +   '<div class="mode-col model"><div class="title">The model</div>'
    +     '<div class="row"><b>'+mod.won+'</b> cargoes won</div>'
    +     '<div class="row"><b>'+money(mod.profit)+'</b> made</div></div>'
    + '</div>'
    + '<div class="verdict-line">That is the project working. It is also the six months where it looks '
    +   'like the project failing: fewer cargoes on the board, more money in the bank.</div>'
    + '<div class="sum-foot"><kbd>R</kbd> present again from the start</div>';
}

/* ---- Failsafe: never show a blank screen to an audience ------------------ */
function renderFailsafe(err){
  var box = document.getElementById("sum-box");
  var c = state.canonical || { seaTrial:{won:0,profit:0}, model:{won:0,profit:0} };
  var more = c.model.profit - c.seaTrial.profit, wonDiff = c.seaTrial.won - c.model.won;
  box.innerHTML = '<div class="delta-lead">Same ten cargoes. With the model you made</div>'
    + '<div class="delta">'+money(more)+'</div>'
    + '<div class="delta-sub">more money — on '+wonDiff+' fewer cargoes.</div>';
  document.getElementById("summary").classList.add("show");
}

/* ===================== INTERACTION ======================================= */
function doTake(){
  if (state.idx>=10 || state.stage!=="decide") return;
  state.decisions[state.idx] = "quote";
  state.stage = "resolved";
  render();
}
function advance(){
  if (state.idx>=10) return;
  if (state.stage==="decide"){ doTake(); return; }   // Space takes the cargo
  state.idx++;
  if (state.idx>=10){
    state.stage="resolved";
    if (state.mode==="model") state.modelRevealed = true;   // completing the model run reveals the comparison
  } else {
    state.stage="decide";
  }
  render();
}
function toggleMode(){
  state.mode = (state.mode==="seaTrial") ? "model" : "seaTrial";
  resetRun();
}
function resetRun(){
  // Voyage 1 is pre-played so the cold open is never an empty chart (F4).
  state.idx = 0; state.stage = "resolved";
  state.decisions = new Array(10).fill(null);
  state.decisions[0] = "quote";
  render();
}
function coldReset(){                    // R — back to a fresh, model-hidden presentation
  state.mode = "seaTrial";
  state.modelRevealed = false;
  resetRun();
}
function jumpToEnd(){
  for (var i=0;i<10;i++) if (!state.decisions[i]) state.decisions[i]="quote";
  state.idx = 10; state.stage = "resolved";
  if (state.mode==="model") state.modelRevealed = true;
  render();
}
function fullReset(){
  ASSUMPTIONS = clone(DEFAULTS);
  generate();
  coldReset();
}

/* ---- Keyboard ------------------------------------------------------------ */
document.addEventListener("keydown", function(e){
  if (isTyping(e.target)) return;
  var k = e.key.toLowerCase();
  if (e.code==="Space" || e.key===" "){ e.preventDefault(); advance(); }
  else if (k==="m"){ e.preventDefault(); toggleMode(); }
  else if (k==="r"){ e.preventDefault(); coldReset(); }
  else if (k==="e"){ e.preventDefault(); jumpToEnd(); }
  else if (k==="a"){ e.preventDefault(); toggleAssump(); }
});
function isTyping(el){ return el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA"); }

/* ---- Assumptions panel --------------------------------------------------- */
function buildAssump(){
  var body = document.getElementById("assump-body");
  var html = '<div class="note">Illustrative parameters — not company data. '
           + 'Change any value and the run replays deterministically.</div>';
  html += '<div class="section-h">Vessel &amp; curve</div>';
  for (var i=0;i<PARAM_META.length;i++){
    var p = PARAM_META[i];
    if (p.key==="bunker_price") html += '<div class="section-h">Economics</div>';
    if (p.key==="seed")         html += '<div class="section-h">Determinism</div>';
    html += '<div class="arow"><label>'+p.label+'<small>'+p.note+'</small></label>'
          + '<input type="number" step="'+p.step+'" id="param-'+p.key+'" value="'+ASSUMPTIONS[p.key]+'"></div>';
  }
  body.innerHTML = html;
}
function applyAssump(){
  for (var i=0;i<PARAM_META.length;i++){
    var key = PARAM_META[i].key;
    var el = document.getElementById("param-"+key);
    var val = parseFloat(el.value);
    if (!isNaN(val)) ASSUMPTIONS[key] = val;
  }
  generate(); coldReset(); closeAssump();
}
function toggleAssump(){
  var a = document.getElementById("assump");
  if (a.classList.contains("show")) closeAssump();
  else { buildAssump(); a.classList.add("show"); }
}
function closeAssump(){ document.getElementById("assump").classList.remove("show"); }

/* ---- Wire up + init ------------------------------------------------------ */
function init(){
  document.getElementById("btn-assump").addEventListener("click", toggleAssump);
  document.getElementById("btn-assump-close").addEventListener("click", closeAssump);
  document.getElementById("btn-assump-apply").addEventListener("click", applyAssump);
  document.getElementById("btn-assump-reset").addEventListener("click", function(){
    ASSUMPTIONS = clone(DEFAULTS); buildAssump(); generate(); coldReset();
  });
  generate();
  coldReset();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
